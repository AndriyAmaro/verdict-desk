name: hourly-decision

# Appends simulated decisions to ledger/ledger.jsonl every hour, verifies the hash chain,
# publishes ledger/head.json and redeploys the dashboard. Scheduled runs are best effort:
# GitHub may delay or skip them, and the ledger shows those gaps instead of hiding them.
# Setup: add the secret LLM (Mistral API key; read into the MISTRAL_API_KEY env var) and set Pages to "GitHub Actions".
# Without the key the run still records the deterministic core and labels the LLM layers as off.

# GitHub drops and delays scheduled runs: measured on this repository's run history, a single hourly
# trigger fired every 2 to 6 hours, so the ledger covered 30% of the clock hours. The workflow is now
# triggered four times an hour and the gate job lets a run record only when the newest dossier is at
# least 50 minutes old, so extra triggers add chances to run, never duplicate decisions.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python -m verdict_desk due --min-minutes 50 | tee -a "$GITHUB_OUTPUT"
          fi

  decide:
    needs: gate
    # Fail open: if the gate itself breaks, record anyway, because a lost hour costs more than a repeated attempt.
    if: ${{ always() && (needs.gate.result != 'success' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rules v5: v3's named declined states plus the multi-voice convergence as a deterministic argument,
      # each voice weighted by the skill the ledger measured for it (verdict_desk/trust.py), frozen in the
      # dossier. Dossiers already recorded under v1 to v4 keep replaying under their own version.
      - name: Record decisions with rules v5
        env:
          MISTRAL_API_KEY: ${{ secrets.LLM }}
          # Optional repository variables switch the provider without a code change: any OpenAI-compatible
          # chat API works (set LLM_BASE_URL and LLM_MODEL, and put that provider's key in the LLM secret).
          # Unset, they default to Mistral and mistral-small-latest in code.
          MISTRAL_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MISTRAL_MODEL: ${{ vars.LLM_MODEL }}
          # LLM_KEYLESS=1 for a provider that needs no key: no Authorization header is sent, even though the
          # LLM secret may hold a key for another provider. LLM_MIN_INTERVAL spaces calls (seconds), e.g. a
          # free tier that allows one reply every 30 seconds.
          # LLM_PROVIDER=anthropic reads the LLM secret as an Anthropic key and talks to Claude through the native
          # Messages API (default model claude-haiku-5-5). Unset: an OpenAI-style chat API, Mistral by default.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_KEYLESS: ${{ vars.LLM_KEYLESS }}
          MISTRAL_MIN_INTERVAL: ${{ vars.LLM_MIN_INTERVAL }}
        run: python -m verdict_desk decide-v5 BTCUSDT ETHUSDT SOLUSDT --config config/voices.json
      - name: Verify the chain and write the head
        run: |
          python -m verdict_desk verify
          python -m verdict_desk head --out ledger/head.json
      - name: Check that every frozen trust table is supported by the ledger before it
        # No lookahead: each dossier froze the track record of the voices it read, computed only from
        # earlier dossiers. A mismatch is reported loudly here and fails the tests workflow.
        run: python -m verdict_desk trust-check || echo "::warning::a frozen trust table is not supported by the ledger before it"
      - name: Check the ledger against the head anchored on Sepolia
        # Read-only comparison: the anchored dossier must still carry the hash the
        # chain recorded. Exit 1 (history no longer matches) fails the run on purpose;
        # exit 2 (RPC unreachable) only warns, so an outage does not look like tampering.
        run: |
          set +e
          python -m verdict_desk monitor
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::the published ledger no longer matches the head anchored on Sepolia"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::could not reach the RPC to compare with the on-chain anchor"
          fi
          exit 0
      - name: Timestamp the head in Bitcoin (OpenTimestamps, no key, no wallet)
        # The proof is archived PER RECORD, not overwritten: a .ots proves the exact bytes that
        # were stamped, so replacing it every hour would silently invalidate every earlier proof
        # (ots verify would fail against the new head). Each hour keeps its own snapshot + proof.
        # Pending proofs are upgraded on later runs, which is how OTS confirms into a block.
        run: |
          pip install --quiet opentimestamps-client
          mkdir -p ledger/timestamps
          for proof in ledger/timestamps/*.ots; do
            [ -e "$proof" ] || continue
            ots upgrade "$proof" >/dev/null 2>&1 || true
          done
          seq=$(python3 -c "import json; print(json.load(open('ledger/head.json'))['seq'])")
          cp ledger/head.json "ledger/timestamps/$seq.json"
          ots stamp "ledger/timestamps/$seq.json" || echo "::warning::calendar unreachable this hour; the head is still published and hash-chained"
          ots verify "ledger/timestamps/$seq.json.ots" 2>&1 | tail -6 || true
          echo "archived proofs: $(ls ledger/timestamps/*.ots 2>/dev/null | wc -l)"

      - name: Publish, and re-record from the freshest head on a push race
        env:
          MISTRAL_API_KEY: ${{ secrets.LLM }}
          MISTRAL_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MISTRAL_MODEL: ${{ vars.LLM_MODEL }}
          # LLM_KEYLESS=1 for a provider that needs no key: no Authorization header is sent, even though the
          # LLM secret may hold a key for another provider. LLM_MIN_INTERVAL spaces calls (seconds), e.g. a
          # free tier that allows one reply every 30 seconds.
          # LLM_PROVIDER=anthropic reads the LLM secret as an Anthropic key and talks to Claude through the native
          # Messages API (default model claude-haiku-5-5). Unset: an OpenAI-style chat API, Mistral by default.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_KEYLESS: ${{ vars.LLM_KEYLESS }}
          MISTRAL_MIN_INTERVAL: ${{ vars.LLM_MIN_INTERVAL }}
        run: |
          set -uo pipefail
          git config user.name "verdict-desk-bot"
          git config user.email "verdict-desk-bot@users.noreply.github.com"
          # Commit first: git rebase refuses to run on a dirty tree, so the old order
          # (pull --rebase before commit) died whenever a human pushed while the bot was
          # recording (run 39653930760, 2026-10-21: dossiers lost).
          git add ledger
          if git diff --cached --quiet; then
            echo "nothing recorded this hour"
            exit 0
          fi
          git commit -m "ledger: $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3; do
            # A conflict here means two writers both appended a dossier. Rebasing cannot
            # merge that correctly (a union would duplicate a sequence number), so the only
            # safe recovery is: drop our commit, reset to what actually got published, and
            # record again from there. `git rebase --abort` first, because an aborted rebase
            # leaves "unmerged files" that made the next pull fail instantly (run 39863662557).
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              exit 0
            fi
            echo "push attempt $attempt raced; re-recording from the freshest published head..."
            git rebase --abort 2>/dev/null || true
            git reset --hard "origin/${{ github.ref_name }}"
            python -m verdict_desk decide-v5 BTCUSDT ETHUSDT SOLUSDT --config config/voices.json || true
            python -m verdict_desk verify
            python -m verdict_desk head --out ledger/head.json
            git add ledger
            if git diff --cached --quiet; then
              echo "the freshest head already has this hour's decisions"
              exit 0
            fi
            git commit -m "ledger: $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          exit 1

  pages:
    needs: decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build the site (dashboard plus the public ledger)
        run: |
          mkdir site
          cp -r web/. site/
          cp -r ledger site/ledger
          # Exibe as ultimas decisoes como documentos de auditoria (o ancorado sempre entra).
          # Evidence packs (about 90 KB each) for the newest dossiers and the anchored one; an exhibit links its pack when it exists.
          python -m verdict_desk packs --recent 24 --anchored --outdir site/pack
          python -m verdict_desk exhibit --recent 400 --outdir site/exhibit --packs site/pack --anchor --rpc "${{ env.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}" || echo "exhibits skipped: anchor unreachable"
          ls site/exhibit | head -3
          python -m verdict_desk scorecard --out site/scorecard.html
          # What the witnesses page reads: the stamped heads and the anchor contract, and the result of
          # attacking a copy of the ledger with every mutation we know (seeded by the head hash).
          python -m verdict_desk witnesses --out site/witnesses.json
          python -m verdict_desk battery --trials 1500 --out site/battery.json || echo "battery skipped this hour"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
