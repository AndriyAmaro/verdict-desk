name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The published numbers include who recorded each dossier (git blame of the ledger). A shallow clone
          # attributes every line to one commit, so the freshness test failed in CI while passing locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (includes the Python and JavaScript hash cross-check)
        run: python -m unittest discover -s tests
      - name: The shipped ledger verifies
        run: |
          if [ -f ledger/ledger.jsonl ]; then python -m verdict_desk verify; fi

  anchor-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre/anchor
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install generated binding dependencies
        working-directory: cre/contracts
        run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
