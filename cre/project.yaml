# CRE project settings for the Verdict Desk ledger anchor.
# Simulation runs against the public Sepolia RPC below. Nothing is broadcast unless
# `cre workflow simulate --broadcast` is passed (that needs a funded testnet key in .env).
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
